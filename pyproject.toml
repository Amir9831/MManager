[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mmanager"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "argon2-cffi>=23.1,<26"]
[project.scripts]
Mmanager = "mmanager.cli:main"
[tool.setuptools.packages.find]
include = ["mmanager*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
mmanager = ["templates/*.properties", "templates/*.yml"]
