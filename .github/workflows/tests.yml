name: tests
on: [push, pull_request]
jobs:
 test:
  strategy:
   fail-fast: false
   matrix:
    os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    python: ['3.10','3.12']
  runs-on: ${{ matrix.os }}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with:
      python-version: ${{ matrix.python }}
   - run: pip install -r requirements.txt pytest httpx
   - run: pip install -e .
   - run: python -m compileall -q mmanager
   - uses: actions/setup-node@v4
     with:
      node-version: '22'
   - name: Validate web panel JavaScript
     run: |
      python - <<'PY'
      from pathlib import Path
      import re
      html = Path('mmanager/web/index.html').read_text()
      scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
      assert len(scripts) == 1, 'Expected exactly one inline panel script'
      Path('/tmp/mmanager-panel.js').write_text(scripts[0])
      PY
      node --check /tmp/mmanager-panel.js
   - run: bash -n install.sh
   - run: pytest -q
